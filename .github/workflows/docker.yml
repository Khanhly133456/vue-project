name: CI/CD Vue

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t khanhly123/vue-project:latest \
            .

      - name: Push Docker image
        run: |
          docker push khanhly123/vue-project:latest

      - name: Deploy
        run: |
          docker pull khanhly123/vue-project:latest

          docker rm -f vue-project || true

          docker run -d \
            --name vue-project \
            --restart unless-stopped \
            -p 8080:80 \
            khanhly123/vue-project:latest

          docker ps
